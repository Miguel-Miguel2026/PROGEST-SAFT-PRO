name: Alerta matinal cripto

on:
  schedule:
    # 06:45 UTC = 07:45 em Luanda (UTC+1), todos os dias
    - cron: "45 6 * * *"
  workflow_dispatch:

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar resumo do mercado
        run: python crypto-alertas/alerta_matinal.py
        env:
          CRYPTO_MOEDAS: ${{ vars.CRYPTO_MOEDAS }}
          MOEDA_BASE: ${{ vars.MOEDA_BASE }}
          LIMIAR_ALERTA: ${{ vars.LIMIAR_ALERTA }}
          ALERTAS_PRECO: ${{ vars.ALERTAS_PRECO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
